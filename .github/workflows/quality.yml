name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oralis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oralis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oralis -d oralis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://oralis:ci-only-password@127.0.0.1:5432/oralis_dev
      DATABASE_URL_TEST: postgres://oralis:ci-only-password@127.0.0.1:5432/oralis_test
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:4000
      SESSION_COOKIE_SECURE: 'false'
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JOBS_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:tools
      - run: npm test
      - run: npm run build
